[project]
name = "concord"
version = "0.1.0"
description = "Vendor data reconciliation and risk platform"
readme = "README.md"
authors = [
    { name = "aj-khved", email = "akhvedelidze99@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
concord = "concord:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
datagen = [
    "faker>=40.40.0",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
